# Remotless: macOS build. Trimmed from flutter-build.yml (build-for-macOS), keeping upstream's exact
# toolchain versions: Intel on Flutter 3.24.5, Apple Silicon on Flutter 3.44.9 with upstream's 3.44
# source patches (3.24.5's engine crashes on arm64). Produces Remotless-<version>-<arch>.dmg
# (bundle Remotless.app, ID com.remotless.app). Run it from the Actions tab ("Run workflow").
#
# Signing + notarization (TKOCY LTD, Team ID K42MDMGU82) when the repo has these secrets:
#   MACOS_P12_BASE64 / MACOS_P12_PASSWORD  "Developer ID Application: TKOCY LTD" certificate + key (.p12)
#   APP_STORE_CONNECT_API_KEY (.p8 text) / APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID
# The originals live in remotless-client-keys/apple on the S: drive. Without the secrets the dmg is
# unsigned (-unsigned.dmg), which macOS blocks on first launch: testing only.
name: Remotless macOS build

on:
  workflow_dispatch:
  # Until the workflow is on master (needed for Run workflow), pushes to the mac-app branch build it.
  push:
    branches: [mac-app]

permissions:
  contents: read

env:
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.6.3"
  BRAND: "Remotless"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-macos:
    needs: [generate-bridge]
    name: macOS ${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.os }}
    env:
      # Secrets can't be used in step `if:` conditions, so turn "secret is set" into a plain flag.
      SIGN: ${{ secrets.MACOS_P12_BASE64 != '' && 'true' || 'false' }}
      IDENTITY: "Developer ID Application: TKOCY LTD (K42MDMGU82)"
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-apple-darwin, os: macos-15-intel, extra-build-args: "", arch: x86_64 }
          # Apple Silicon is cross-built on the Intel runner: GitHub's arm64 macOS pool kept cancelling
          # jobs for lack of capacity (Nov 2026). cross: true switches vcpkg, cargo and Xcode to arm64.
          - { target: aarch64-apple-darwin, os: macos-15-intel, extra-build-args: "--screencapturekit", arch: aarch64, cross: true }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Check Remotless branding is in the build
        shell: bash
        run: |
          grep -q 'RwLock::new("Remotless"' libs/hbb_common/src/config.rs || { echo "hbb_common is not the Remotless fork"; exit 1; }
          grep -q '"app.remotless.com"' libs/hbb_common/src/config.rs || { echo "default server not set"; exit 1; }
          grep -q '^PRODUCT_NAME = Remotless$' flutter/macos/Runner/Configs/AppInfo.xcconfig || { echo "macOS app is not named Remotless"; exit 1; }
          grep -q 'customModule="Remotless"' flutter/macos/Runner/Base.lproj/MainMenu.xib || { echo "MainMenu.xib module does not match PRODUCT_NAME"; exit 1; }

      - name: Import the Developer ID certificate
        if: env.SIGN == 'true'
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain: remotless

      - name: Check the signing identity
        if: env.SIGN == 'true'
        shell: bash
        run: |
          security default-keychain -s remotless.keychain
          IDS=$(security find-identity -v -p codesigning)
          echo "$IDS"
          [[ "$IDS" == *"$IDENTITY"* ]] || { echo "::error::$IDENTITY not in the keychain"; exit 1; }

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x from the official release (Homebrew's NASM 3.x breaks aom and friends).
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: remotless-${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # arm64's *.freezed.dart must match the freezed it resolves under Flutter 3.44.
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          TRIPLET_ARG=""
          if [ "${{ matrix.job.cross }}" = "true" ]; then
            TRIPLET_ARG="--triplet arm64-osx"
            # vcpkg.json asks for ffmpeg as a *host* package on macOS (host = target on a native build).
            # When cross-building, host is the Intel runner, so ask for it for the target triplet instead.
            python3 - <<'PY'
          import json
          d = json.load(open('vcpkg.json'))
          for dep in d['dependencies']:
              if isinstance(dep, dict) and dep.get('name') == 'ffmpeg' and dep.get('host') and 'osx' in dep.get('platform', ''):
                  dep['host'] = False
                  print('ffmpeg: host -> target for the cross build')
          json.dump(d, open('vcpkg.json', 'w'), indent=2)
          PY
          fi
          if ! $VCPKG_ROOT/vcpkg install $TRIPLET_ARG --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build Remotless
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.job.cross }}" = "true" ]; then
            export REMOTLESS_MAC_TARGET=${{ matrix.job.target }}
            export VCPKGRS_TRIPLET=arm64-osx
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Check the app bundle
        shell: bash
        run: |
          APP=./flutter/build/macos/Build/Products/Release/${BRAND}.app
          [ -d "$APP" ] || { echo "no $APP"; ls flutter/build/macos/Build/Products/Release; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleName" -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.remotless.app" ] || { echo "wrong bundle ID"; exit 1; }
          [ -x "$APP/Contents/MacOS/${BRAND}" ] || { echo "no $APP/Contents/MacOS/${BRAND}"; exit 1; }
          [ -x "$APP/Contents/MacOS/service" ] || { echo "the background service binary was not copied into the app"; exit 1; }
          file "$APP/Contents/MacOS/${BRAND}"
          # The app, its Rust library and the service must all be built for this job's architecture.
          WANT=$([ "${{ matrix.job.arch }}" = "aarch64" ] && echo arm64 || echo x86_64)
          for f in "$APP/Contents/MacOS/${BRAND}" "$APP/Contents/MacOS/service" "$APP/Contents/Frameworks/liblibrustdesk.dylib"; do
            [ -e "$f" ] || continue
            A=$(lipo -archs "$f"); echo "$f: $A"
            [ "$A" = "$WANT" ] || { echo "::error::$f is '$A', expected $WANT"; exit 1; }
          done

      - name: Sign, package and notarize
        shell: bash
        env:
          ARCH: ${{ matrix.job.arch }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P12_PASS: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          APP="./flutter/build/macos/Build/Products/Release/${BRAND}.app"
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          if [ "$SIGN" = "true" ]; then
            DMG="${BRAND}-${VERSION}-${ARCH}.dmg"
            security default-keychain -s remotless.keychain
            security unlock-keychain -p "$P12_PASS" remotless.keychain
            # Apple's timestamp server sometimes doesn't answer ("A timestamp was expected"): retry signing.
            for i in 1 2 3 4; do bash ./.github/scripts/sign-macos-app.sh "$APP" "$IDENTITY" ./flutter/macos/Runner/Release.entitlements && break; [ $i = 4 ] && exit 1; echo "signing failed, retrying ($i)"; sleep 30; done
          else
            echo "::warning::No MACOS_P12_BASE64 secret: building an UNSIGNED dmg (testing only)."
            DMG="${BRAND}-${VERSION}-${ARCH}-unsigned.dmg"
          fi
          create-dmg --volname "${BRAND}" --icon "${BRAND}.app" 200 190 --hide-extension "${BRAND}.app" \
            --window-size 800 400 --app-drop-link 600 185 "$DMG" "$APP"
          if [ "$SIGN" = "true" ]; then
            for i in 1 2 3 4; do codesign --force --timestamp -s "$IDENTITY" "$DMG" -vvv && break; [ $i = 4 ] && exit 1; sleep 30; done
            printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            NT=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER")
            # Submit once, then wait on that submission; the runners' network sometimes drops for a few
            # seconds (DNS errors), so waiting and stapling are retried instead of failing the build.
            SUB=$(for i in 1 2 3; do xcrun notarytool submit "$DMG" "${NT[@]}" --output-format json && break; sleep 30; done | tail -n 1)
            ID=$(echo "$SUB" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
            echo "notarization submission $ID"
            STATUS=""
            for i in 1 2 3 4 5 6; do
              STATUS=$(xcrun notarytool wait "$ID" "${NT[@]}" --timeout 20m --output-format json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))') && [ -n "$STATUS" ] && break
              echo "wait interrupted, retrying ($i)"; sleep 30
            done
            echo "notarization status: $STATUS"
            if [ "$STATUS" != "Accepted" ]; then xcrun notarytool log "$ID" "${NT[@]}" || true; rm -f "$RUNNER_TEMP/AuthKey.p8"; exit 1; fi
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            for i in 1 2 3 4 5; do xcrun stapler staple "$DMG" && break; [ $i = 5 ] && exit 1; sleep 30; done
            # Gatekeeper's verdict, as a customer's Mac would see it.
            spctl -a -vv -t open --context context:primary-signature "$DMG"
            # Double-check the stapled ticket (Apple's ticket server sometimes drops the connection: retry).
            for i in 1 2 3 4 5; do xcrun stapler validate "$DMG" && break; [ $i = 5 ] && exit 1; sleep 20; done
          fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          ls -la *.dmg

      - name: Upload dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.SIGN == 'true' && format('Remotless-macos-{0}', matrix.job.arch) || format('Remotless-macos-{0}-unsigned', matrix.job.arch) }}
          path: ${{ env.DMG }}
          retention-days: 14
