# Remotless: Android build. Trimmed from flutter-build.yml (build-rustdesk-android + the universal APK job),
# keeping upstream's exact toolchain versions. Builds the Rust library for arm64, armv7 and x86_64, then one
# universal APK (Remotless-<version>-android.apk) with application ID com.remotless.app.
# Run it from the Actions tab ("Run workflow").
#
# Signing: the APK is signed with the Remotless release key when the repo has the secrets
# ANDROID_SIGNING_KEY (base64 of the .jks), ANDROID_KEY_STORE_PASSWORD and ANDROID_KEY_PASSWORD (key alias: remotless).
# Never change that key: Android refuses updates signed with a different one. Without the secrets the build
# uses the debug key, which is only good for testing.
name: Remotless Android build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"
  VERSION: "1.6.3"
  BRAND: "Remotless"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-lib:
    needs: [generate-bridge]
    name: Rust library ${{ matrix.job.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        job:
          - { target: aarch64-linux-android, abi: arm64-v8a, script: ndk_arm64.sh }
          - { target: armv7-linux-androideabi, abi: armeabi-v7a, script: ndk_arm.sh }
          - { target: x86_64-linux-android, abi: x86_64, script: ndk_x64.sh }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libc6-dev libclang-dev \
               libunwind-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Check Remotless branding is in the build
        shell: bash
        run: |
          grep -q 'RwLock::new("Remotless"' libs/hbb_common/src/config.rs || { echo "hbb_common is not the Remotless fork"; exit 1; }
          grep -q '"app.remotless.com"' libs/hbb_common/src/config.rs || { echo "default server not set"; exit 1; }
          grep -q 'applicationId "com.remotless.app"' flutter/android/app/build.gradle || { echo "Android application ID is not com.remotless.app"; exit 1; }

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: remotless-android
          key: ${{ matrix.job.target }}

      - name: Build Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.script }}
          mkdir -p out/${{ matrix.job.abi }}
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so out/${{ matrix.job.abi }}/librustdesk.so
          case ${{ matrix.job.target }} in
            aarch64-linux-android)   triple=aarch64-linux-android ;;
            armv7-linux-androideabi) triple=arm-linux-androideabi ;;
            x86_64-linux-android)    triple=x86_64-linux-android ;;
          esac
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$triple/libc++_shared.so out/${{ matrix.job.abi }}/

      - name: Upload library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jnilibs-${{ matrix.job.abi }}
          path: out/
          retention-days: 3

  build-apk:
    needs: [build-lib]
    name: Universal APK
    runs-on: ubuntu-24.04
    env:
      # Secrets can't be used in step `if:` conditions, so turn "secret is set" into a plain flag.
      SIGN: ${{ secrets.ANDROID_SIGNING_KEY != '' && 'true' || 'false' }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Download Rust libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jnilibs-*
          merge-multiple: true
          path: ./flutter/android/app/src/main/jniLibs

      - name: Set up the release key
        if: env.SIGN == 'true'
        shell: bash
        env:
          KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEY_ALIAS: remotless
          STORE_PASS: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/remotless-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/remotless-release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > flutter/android/key.properties

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          tree flutter/android/app/src/main/jniLibs
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx4g/g" ./flutter/android/gradle.properties
          if [ "$SIGN" != "true" ]; then
            echo "::warning::No ANDROID_SIGNING_KEY secret: signing with the debug key (testing only)."
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          fi
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm,android-x64
          popd
          mkdir -p out
          mv ./flutter/build/app/outputs/flutter-apk/app-release.apk "out/${BRAND}-${VERSION}-android.apk"
          rm -f flutter/android/key.properties

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Remotless-android-${{ env.SIGN == 'true' && 'signed' || 'debug-signed' }}
          path: out/*.apk

      - name: Check the APK
        shell: bash
        run: |
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          BADGING=$(/usr/local/lib/android/sdk/build-tools/$BT/aapt dump badging out/*.apk)
          CERTS=$(/usr/local/lib/android/sdk/build-tools/$BT/apksigner verify --print-certs out/*.apk)
          echo "$BADGING" | grep -E "^package:|^application-label:" || true
          echo "$CERTS"
          sha256sum out/*.apk
          [[ "$BADGING" == *"name='com.remotless.app'"* ]] || { echo "::error::wrong application ID"; exit 1; }
          # SHA-256 of the Remotless release certificate (keystore in remotless-client-keys on the S: drive).
          if [ "$SIGN" = "true" ] && [[ "$CERTS" != *"0ec0594e2ed317a33087f7d0da365be24f8a29ed94b0d10a2c631ab9b2d09fe8"* ]]; then
            echo "::error::APK is not signed with the Remotless release key"; exit 1
          fi
