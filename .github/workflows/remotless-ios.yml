# Remotless: iPhone/iPad build. Trimmed from flutter-build.yml (build-rustdesk-ios), keeping upstream's
# exact toolchain versions. Builds the Rust library for aarch64-apple-ios, then the app (bundle ID
# com.remotless.app). Run it from the Actions tab ("Run workflow").
#
# Signing + TestFlight (TKOCY LTD, Team ID K42MDMGU82) when the repo has these secrets:
#   IOS_P12_BASE64 / IOS_P12_PASSWORD   "Apple Distribution: TKOCY LTD" certificate + key (.p12)
#   IOS_PROVISION_PROFILE_BASE64        App Store profile "Remotless App Store" for com.remotless.app
#   APP_STORE_CONNECT_API_KEY (.p8 text) / APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID
# The originals live in remotless-client-keys/apple on the S: drive. With them, the signed .ipa is
# uploaded to App Store Connect and shows up in TestFlight after Apple's processing (~15-30 min).
# The build number is the workflow run number, so every upload is a new TestFlight build.
# Without the secrets the build is unsigned (archive only, to check it compiles).
name: Remotless iOS build

on:
  workflow_dispatch:
  # Until the workflow is on master (needed for Run workflow), pushes to the ios-app branch build it.
  push:
    branches: [ios-app]

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.6.4"
  BRAND: "Remotless"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-ios:
    needs: [generate-bridge]
    name: iOS
    # Intel runner: the arm64 macOS pool keeps cancelling jobs for lack of capacity (Nov 2026).
    # The app is cross-compiled for iPhones either way.
    runs-on: macos-15-intel
    env:
      SIGN: ${{ secrets.IOS_P12_BASE64 != '' && 'true' || 'false' }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Check Remotless branding is in the build
        shell: bash
        run: |
          grep -q 'RwLock::new("Remotless"' libs/hbb_common/src/config.rs || { echo "hbb_common is not the Remotless fork"; exit 1; }
          grep -q '"app.remotless.com"' libs/hbb_common/src/config.rs || { echo "default server not set"; exit 1; }
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.remotless.app;' flutter/ios/Runner.xcodeproj/project.pbxproj || { echo "iOS bundle ID is not com.remotless.app"; exit 1; }

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: remotless-ios
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build Rust library
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Pick the newest Xcode
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app
          # App Store uploads must be built with a current SDK; use the newest Xcode on the runner.
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Import the Apple Distribution certificate
        if: env.SIGN == 'true'
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
          keychain: remotless

      - name: Install the provisioning profile
        if: env.SIGN == 'true'
        shell: bash
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          security find-identity -v -p codesigning
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/remotless.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/remotless.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          echo "Profile: $NAME ($UUID)"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/remotless.mobileprovision" "$d/$UUID.mobileprovision"
          done

      - name: Build app
        shell: bash
        run: |
          pushd flutter
          if [ "$SIGN" = "true" ]; then
            flutter build ipa --release --build-name "$VERSION" --build-number "${{ github.run_number }}" \
              --export-options-plist=ios/exportOptions.plist
          else
            # Unsigned: the Runner target asks for manual signing, so switch it off for this build.
            flutter build ipa --release --build-name "$VERSION" --build-number "${{ github.run_number }}" --no-codesign
          fi
          popd
          APP=flutter/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          [ -d "$APP" ] || { echo "no Runner.app in the archive"; ls -R flutter/build/ios | head -50; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleDisplayName" \
            -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.remotless.app" ] || { echo "wrong bundle ID"; exit 1; }
          mkdir -p out
          if [ "$SIGN" = "true" ]; then
            IPA=$(ls flutter/build/ios/ipa/*.ipa | head -n 1)
            [ -f "$IPA" ] || { echo "no .ipa exported"; ls -R flutter/build/ios | head -50; exit 1; }
            cp "$IPA" "out/${BRAND}-${VERSION}-${{ github.run_number }}-ios.ipa"
            codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier="
          else
            ditto -c -k --sequesterRsrc --keepParent flutter/build/ios/archive/Runner.xcarchive "out/${BRAND}-${VERSION}-ios-unsigned.xcarchive.zip"
          fi
          ls -la out

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Remotless-ios${{ env.SIGN == 'true' && '' || '-unsigned' }}
          path: out/*
          retention-days: 14

      - name: Upload to TestFlight
        if: env.SIGN == 'true'
        shell: bash
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls out/*.ipa)
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
